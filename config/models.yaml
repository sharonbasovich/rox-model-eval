  #   params: { temperature: 0, max_tokens: 2048 }
  #
  # Rox's own gateway measures the model *as Rox calls it* (middleware + system prompt
  # wrapping included), which is the number that actually predicts production behaviour.
  # - id: rox-gateway-default
  #   adapter: openai
  #   model: rox-default
  #   base_url: https://<rox-gateway-host>/v1
  #   api_key_env: ROX_GATEWAY_API_KEY

  # Hybrid: Laya, an open-weight System One decision model (not TypeSafe's Jev), makes
  # typed decisions locally on CPU; gpt-6-luna writes all text. Needs `pip install -e '.[laya]'`.
  # Revision is pinned to the 2026-09-24 weights.
  - id: laya+gpt-6-luna
    adapter: hybrid
    model: laya+gpt-6-luna
    params:
      writer: gpt-6-luna
      decider: { model: convaiinnovations/laya, revision: 55cf4c4ebb4e, device: cpu }
      pipelines: [c3_insights, c4_grounded_qa, c8_safety, c11_reply_triage]

  # Same pair, Laya always decides the reply category (no confidence gate): shows what
  # the gate buys.
  - id: laya-always+gpt-6-luna
    adapter: hybrid
    model: laya-always+gpt-6-luna
    params:
      writer: gpt-6-luna
      decider: { model: convaiinnovations/laya, revision: 55cf4c4ebb4e, device: cpu }
      pipelines: [c11_reply_triage]
      triage_confidence: 0.0
