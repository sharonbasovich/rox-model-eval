capability: c7_long_context
name: Long-context synthesis over call transcripts
description: >
  Deterministically generated long sales-call transcripts (filler conversation) with planted
  facts at controlled depths, plus distractors: values stated early and corrected later.
  Measures needle recall across depth and length, and whether the model uses the latest
  value rather than a superseded one. Transcript length is set per task via
  `transcript_spec.target_words`.
scorer: long_context
system: >
  You analyse sales call transcripts for a revenue platform. Answer only from the
  transcript. When a value is revised later in the call, use the final value. Respond with
  JSON only.
prompt_template: |
  From the transcript, extract: {{fields}}.
  Return a JSON object with exactly those keys; use null if not stated.

  TRANSCRIPT:
  {{transcript}}
tasks:
  - id: c7-001-budget-revision-6k
    tags: [6k-words, revision]
    inputs:
      fields: budget, decision_date, economic_buyer
      transcript_spec:
        seed: 11
        target_words: 6000
        needles:
          - {depth: 0.85, text: "Customer: Update from finance -- the approved budget is now $95,000, not the earlier number."}
          - {depth: 0.5, text: "Customer: We need to sign by November 14 to make the fiscal year."}
          - {depth: 0.3, text: "Customer: Final sign-off sits with our CFO, Renata Silva."}
        distractors:
          - {depth: 0.15, text: "Customer: Our budget for this is roughly $120,000."}
    expected:
      fields:
        budget: ["95,000", "95000", "95k"]
        decision_date: ["November 14", "Nov 14", "11-14"]
        economic_buyer: ["Renata Silva"]
      traps:
        budget: ["120,000", "120000", "120k"]
    reference_output: {budget: "$95,000", decision_date: "November 14", economic_buyer: "Renata Silva"}

  - id: c7-002-competitor-deep-12k
    tags: [12k-words, deep-needle]
    inputs:
      fields: competitor, primary_blocker, seats
      transcript_spec:
        seed: 22
        target_words: 12000
        needles:
          - {depth: 0.92, text: "Customer (IT): The real blocker is that we need SCIM provisioning before security signs off."}
          - {depth: 0.08, text: "Customer: Just so you know, we're also looking at Northwind CRM Suite."}
          - {depth: 0.6, text: "Customer: After re-scoping with the regional leads we landed on 85 seats."}
        distractors:
          - {depth: 0.35, text: "Customer: We're thinking around 150 seats to start, but that could change."}
    expected:
      fields:
        competitor: ["Northwind"]
        primary_blocker: ["SCIM"]
        seats: ["85"]
      traps:
        seats: ["150"]
    reference_output: {competitor: "Northwind CRM Suite", primary_blocker: "SCIM provisioning required by security", seats: 85}

  - id: c7-003-champion-change-20k
    tags: [20k-words, revision]
    inputs:
      fields: champion, next_step, pilot_start
      transcript_spec:
        seed: 33
        target_words: 20000
        needles:
          - {depth: 0.7, text: "Customer: Quick heads up, Marco is moving teams, so Aisha Patel will be your main point of contact from here."}
          - {depth: 0.95, text: "Rep: So the next step is a security review call with your IT team on Thursday."}
          - {depth: 0.45, text: "Customer: We'd like the pilot to start on October 20."}
        distractors:
          - {depth: 0.1, text: "Customer: Marco Bianchi will be driving this internally, he's our champion."}
    expected:
      fields:
        champion: ["Aisha Patel"]
        next_step: ["security review"]
        pilot_start: ["October 20", "Oct 20", "10-20"]
      traps:
        champion: ["Marco"]
    reference_output: {champion: "Aisha Patel", next_step: "Security review call with IT on Thursday", pilot_start: "October 20"}

  - id: c7-004-many-needles-8k
    tags: [8k-words, multi-needle]
    inputs:
      fields: current_tool, contract_end, integration_required, region
      transcript_spec:
        seed: 44
        target_words: 8000
        needles:
          - {depth: 0.2, text: "Customer: Today everything runs through Pipestack, which we've used for years."}
          - {depth: 0.4, text: "Customer: The Pipestack contract ends March 31, so timing works."}
          - {depth: 0.65, text: "Customer (IT): Any tool has to integrate with our Snowflake warehouse, that's non-negotiable."}
          - {depth: 0.9, text: "Customer: Rollout would be EMEA first, then North America later."}
        distractors: []
    expected:
      fields:
        current_tool: ["Pipestack"]
        contract_end: ["March 31", "Mar 31", "03-31"]
        integration_required: ["Snowflake"]
        region: ["EMEA"]
    reference_output: {current_tool: "Pipestack", contract_end: "March 31", integration_required: "Snowflake", region: "EMEA"}

  - id: c7-005-triple-revision-40k
    tags: [hard, 40k-words, multi-revision, arithmetic]
    inputs:
      fields: budget, seats, go_live_date
      transcript_spec:
        seed: 55
        target_words: 40000
        needles:
          - {depth: 0.9, text: "Customer: Final word from finance: the budget is locked at $128,000. That replaces both earlier numbers."}
          - {depth: 0.3, text: "Customer: Let's start with 40 seats for the sales team."}
          - {depth: 0.7, text: "Customer: And add 25 more seats for customer success on day one, so the order covers both teams."}
          - {depth: 0.6, text: "Customer: Our target go-live is January 12."}
        distractors:
          - {depth: 0.1, text: "Customer: Budget-wise we're thinking around $150,000."}
          - {depth: 0.45, text: "Customer: Finance trimmed it, the budget is now $135,000."}
          - {depth: 0.5, text: "Rep: For reference, list price for that package would be $160,000."}
    expected:
      fields:
        budget: ["128,000", "128000", "128k"]
        seats: ["65"]
        go_live_date: ["January 12", "Jan 12", "01-12"]
      traps:
        budget: ["150,000", "150000", "150k", "135,000", "135000", "135k", "160,000", "160000", "160k"]
        seats: ["40", "25"]
    reference_output: {budget: "$128,000", seats: 65, go_live_date: "January 12"}

  - id: c7-006-speaker-attribution-60k
    tags: [hard, 60k-words, attribution]
    inputs:
      fields: competitor_being_evaluated, primary_blocker, final_decision_maker
      transcript_spec:
        seed: 66
        target_words: 60000
        needles:
          - {depth: 0.8, text: "Customer: The other vendor we're seriously evaluating is Clari."}
          - {depth: 0.55, text: "Customer: Honestly, the thing that could kill this is data residency. Everything has to stay in the EU."}
          - {depth: 0.35, text: "Customer: I'm recommending it, but Tomas Lindqvist, our COO, makes the final call."}
        distractors:
          - {depth: 0.2, text: "Rep: A lot of teams your size also look at Gong, for what it's worth."}
          - {depth: 0.65, text: "Customer: Our CFO, Anna Berg, will review the paperwork once it's agreed."}
          - {depth: 0.4, text: "Customer: Pricing is fine, that's not a concern for us."}
    expected:
      fields:
        competitor_being_evaluated: ["Clari"]
        primary_blocker: ["data residency", "EU"]
        final_decision_maker: ["Tomas Lindqvist"]
      traps:
        competitor_being_evaluated: ["Gong"]
        primary_blocker: ["pricing", "price"]
        final_decision_maker: ["Anna Berg"]
    reference_output: {competitor_being_evaluated: "Clari", primary_blocker: "Data residency: everything must stay in the EU", final_decision_maker: "Tomas Lindqvist (COO)"}
