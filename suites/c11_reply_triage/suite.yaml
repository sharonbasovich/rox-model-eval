capability: c11_reply_triage
name: Inbound reply triage
description: >
  Modeled on Rox's campaigns surface: every reply to an outbound sequence has to be sorted
  so the sequence can stop, snooze or hand off, and only replies that need a human-style
  answer get a drafted response. One task = one reply, as replies arrive one at a time.
  Synthetic replies; the categories and priority rules are defined below, not taken from Rox.
scorer: reply_triage
system: >
  You triage replies to a sales rep's outbound emails. Pick exactly one category, applying
  the FIRST rule that fits:
  unsubscribe (asks to stop emailing / be removed, however politely, even if it also says
  something else) > out_of_office (an automatic away/leave reply, even if it names a backup
  contact) > referral (says someone else is the right person and names them) > question
  (asks something specific they want answered) > interested (positive, wants to talk or
  see more) > not_now (open but explicitly later: a future quarter, after an event, "ping
  me in ...") > not_interested (declines). For referral, question and interested write a
  short reply draft from the rep that uses only the SELLER FACTS (never invent numbers,
  customers or features; if the facts don't cover a question, say you'll confirm) and ends
  with a clear next step. For every other category the draft is null. Respond with JSON
  only: {"category": "<category>", "draft": "<text>" | null}.
json_schema:
  type: object
  properties:
    category:
      type: string
      enum: [unsubscribe, out_of_office, referral, question, interested, not_now, not_interested]
    draft: {type: [string, "null"]}
  required: [category, draft]
  additionalProperties: false
prompt_template: |
  SELLER FACTS:
  Ledgerline is revenue-reporting software. SOC 2 Type II certified. Native Salesforce and
  HubSpot sync. Data hosted in the US or EU (customer's choice). 14-day free pilot. Pricing
  is per seat and quoted after a 20-minute scoping call. The rep is Avery Moss.

  ORIGINAL EMAIL (from Avery): {{original}}

  REPLY from {{sender}}:
  {{reply}}
tasks:
- id: c11-001-unsub-polite
  tags:
  - unsubscribe
  inputs:
    sender: Priya Raman
    reply: Hi Avery, thanks, but please take me off your list. Have a good week.
    original: 'Quick question: how is your team reporting pipeline to the board today? Ledgerline syncs
      with Salesforce and builds it automatically.'
  expected:
    category: unsubscribe
    must_mention: []
- id: c11-002-unsub-with-referral
  tags:
  - unsubscribe
  inputs:
    sender: Tom Ekberg
    reply: Not me. Talk to Dana Ruiz in RevOps if anything. And please stop emailing me.
    original: 'Quick question: how is your team reporting pipeline to the board today? Ledgerline syncs
      with Salesforce and builds it automatically.'
  expected:
    category: unsubscribe
    must_mention: []
