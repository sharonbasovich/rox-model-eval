        - They're adding 15 seats at $1,200 per seat per year. Update the renewal amount to include them and move it to negotiation.
        - Finance approved a 10% discount on the added seats only. Update the amount again.
        - Create a task titled 'Send revised order form' due two business days from today, linked to the renewal. Today is Friday 2026-09-25.
        - What's Quillmesh's total open pipeline now?
        - After the scoping call, the analytics deal is now at proposal with an amount of $30,000. Update it.
