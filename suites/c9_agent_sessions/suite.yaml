          - {deal_id: d_3, account_id: acc_qm, name: Quillmesh Pilot, amount: 12000, stage: closed_won, close_date: "2026-03-01"}
          - {deal_id: d_9, account_id: acc_qp, name: Quillpoint Renewal, amount: 8000, stage: proposal, close_date: "2026-10-15"}
    expected:
      forbidden_tools: [send_email]
      state:
        - {table: deals, where: {deal_id: d_1}, equals: {amount: 112200, stage: negotiation}}
        - {table: deals, where: {deal_id: d_2}, equals: {amount: 30000, stage: proposal}}
        - {table: tasks, contains: {title: revised order form}, count: 1, equals: {deal_id: d_1, due_date: "2026-09-29"}}
      turn_mentions:
        - [["96,000", "96000", "96k"], ["proposal"]]
        - [["114,000", "114000", "114k"]]
        - [["112,200", "112200", "112.2k"]]
        - [["2026-09-29", "September 29", "Sep 29", "Sept 29", "9/29"]]
        - [["136,200", "136200", "136.2k"]]
        - []
        - [["142,200", "142200", "142.2k"]]
    reference_output:
      turns:
        - steps:
            - {tool: search_accounts, arguments: {query: Quillmesh}}
            - {tool: list_deals, arguments: {account_id: acc_qm}}
          final: Quillmesh Renewal FY27 is $96,000 at proposal.
        - steps:
            - {tool: update_deal, arguments: {deal_id: d_1, amount: 114000, stage: negotiation}}
          final: Updated to $114,000 and moved to negotiation.
        - steps:
            - {tool: update_deal, arguments: {deal_id: d_1, amount: 112200}}
          final: Updated to $112,200 ($96,000 + 15 x $1,080).
        - steps:
            - {tool: create_task, arguments: {account_id: acc_qm, title: Send revised order form, due_date: "2026-09-29", deal_id: d_1}}
          final: Task created, due 2026-09-29.
        - steps: []
          final: Open pipeline is $136,200 ($112,200 renewal + $24,000 analytics).
        - steps:
            - {tool: update_deal, arguments: {deal_id: d_2, stage: proposal, amount: 30000}}
