capability: c9_agent_sessions
name: Multi-turn stateful CRM agent sessions
description: >
  A rep works with the Rox-style chat agent across 5-7 turns against a stateful CRM: reads
  reflect earlier writes, later requests refer back to earlier answers ("the deal you just
  closed"), and some turns correct or undo earlier work. Scored on the CRM end state
  (every requested change made, nothing else touched), the answer to each turn, valid tool
  arguments, and no unrequested emails. All records are synthetic.
scorer: agent_session
max_steps: 12
system: >
  You are the CRM agent of a revenue platform, working with one sales rep over several
  messages. Use the tools to look things up and act; always look up ids rather than
  guessing them. Only make the changes the rep asks for. Keep track of what you have
  already done in this conversation. Reply to each message with a short answer.
prompt_template: "{{request}}"
tools:
  - type: function
    function:
      name: search_accounts
      description: Find accounts whose name or domain contains the query. Returns [{account_id, name, domain}].
      parameters:
        type: object
        properties: {query: {type: string}}
        required: [query]
        additionalProperties: false
  - type: function
    function:
      name: list_accounts
      description: List accounts with owner and tier, optionally only those owned by an exact owner name.
      parameters:
        type: object
        properties: {owner: {type: string}}
        additionalProperties: false
  - type: function
    function:
      name: get_account
      description: Get one account's details.
      parameters:
        type: object
        properties: {account_id: {type: string}}
        required: [account_id]
        additionalProperties: false
  - type: function
    function:
      name: list_contacts
      description: List contacts at an account (id, name, title, email, status).
      parameters:
        type: object
        properties: {account_id: {type: string}}
        required: [account_id]
        additionalProperties: false
  - type: function
    function:
      name: list_deals
      description: List deals at an account (id, name, amount, stage, close_date, champion_id).
      parameters:
        type: object
        properties: {account_id: {type: string}}
        required: [account_id]
        additionalProperties: false
  - type: function
    function:
      name: list_tasks
      description: List tasks at an account.
      parameters:
        type: object
        properties: {account_id: {type: string}}
        required: [account_id]
        additionalProperties: false
  - type: function
    function:
      name: create_task
      description: Create a follow-up task. Returns the task with its task_id.
      parameters:
        type: object
        properties:
          account_id: {type: string}
          title: {type: string}
          due_date: {type: string, description: "YYYY-MM-DD"}
          deal_id: {type: string}
          contact_id: {type: string}
        required: [account_id, title, due_date]
        additionalProperties: false
  - type: function
    function:
      name: update_task
      description: Change a task's title, due date or status.
      parameters:
        type: object
        properties:
          task_id: {type: string}
          title: {type: string}
          due_date: {type: string}
          status: {type: string, enum: [open, done, cancelled]}
        required: [task_id]
        additionalProperties: false
  - type: function
    function:
      name: update_deal
      description: Change a deal's stage, amount (USD), close date or champion contact.
      parameters:
        type: object
        properties:
          deal_id: {type: string}
          stage: {type: string, enum: [discovery, proposal, negotiation, closed_won, closed_lost]}
          amount: {type: number}
          close_date: {type: string, description: "YYYY-MM-DD"}
          champion_id: {type: string}
        required: [deal_id]
        additionalProperties: false
  - type: function
    function:
      name: update_contact
      description: Change a contact's title, email or status.
      parameters:
        type: object
        properties:
          contact_id: {type: string}
          title: {type: string}
          email: {type: string}
          status: {type: string, enum: [active, left_company]}
        required: [contact_id]
        additionalProperties: false
  - type: function
    function:
      name: update_account
      description: Change an account's owner or tier.
      parameters:
        type: object
        properties:
          account_id: {type: string}
          owner: {type: string}
          tier: {type: string, enum: [smb, mid-market, enterprise]}
        required: [account_id]
        additionalProperties: false
  - type: function
    function:
      name: send_email
      description: Send an email from the rep's mailbox.
      parameters:
        type: object
        properties: {to: {type: string}, subject: {type: string}, body: {type: string}}
        required: [to, subject, body]
        additionalProperties: false
tasks:
  - id: c9-001-pipeline-hygiene-session
    tags: [hard, multi-turn, stateful, back-reference]
    inputs:
      request: Today is 2026-09-27. Which of Harbor Health's open deals are past their close date? I mean Harbor Health itself, not Harbor Health Partners.
      followups:
        - "Push each of those to a close date of 2026-10-31, except the one in negotiation: mark that one closed_lost instead."
        - "For the deal you just closed lost, create a task titled 'Loss review: <deal name>' due 2026-10-03, linked to the deal."
        - "Dana Okafor just left Harbor Health. Mark her contact as left_company. Then for every deal that is still open where she is the champion, create a task 'Find new champion: <deal name>' due 2026-10-07 linked to that deal."
        - Summarize everything you changed today as a short list.
      crm:
        accounts:
          - {account_id: acc_hh, name: Harbor Health, domain: harborhealth.com, owner: Priya Nair, tier: enterprise}
          - {account_id: acc_hhp, name: Harbor Health Partners, domain: hhpartners.com, owner: Sam Ortiz, tier: mid-market}
        contacts:
          - {contact_id: c_1, account_id: acc_hh, name: Dana Okafor, title: VP Operations, email: dokafor@harborhealth.com, status: active}
          - {contact_id: c_2, account_id: acc_hh, name: Leo Brandt, title: Director of IT, email: lbrandt@harborhealth.com, status: active}
          - {contact_id: c_3, account_id: acc_hh, name: Mina Sato, title: CFO, email: msato@harborhealth.com, status: active}
          - {contact_id: c_9, account_id: acc_hhp, name: Dana Okafor, title: Office Manager, email: dana@hhpartners.com, status: active}
        deals:
          - {deal_id: d_101, account_id: acc_hh, name: HH Platform Expansion, amount: 120000, stage: negotiation, close_date: "2026-09-15", champion_id: c_1}
          - {deal_id: d_102, account_id: acc_hh, name: HH Analytics Add-on, amount: 45000, stage: proposal, close_date: "2026-09-20", champion_id: c_1}
          - {deal_id: d_103, account_id: acc_hh, name: HH Pilot West, amount: 18000, stage: discovery, close_date: "2026-09-01", champion_id: c_2}
          - {deal_id: d_104, account_id: acc_hh, name: HH Renewal 2027, amount: 210000, stage: proposal, close_date: "2026-12-15", champion_id: c_1}
          - {deal_id: d_105, account_id: acc_hh, name: HH Services, amount: 30000, stage: closed_won, close_date: "2026-08-30", champion_id: c_3}
          - {deal_id: d_201, account_id: acc_hhp, name: HHP Onboarding, amount: 60000, stage: proposal, close_date: "2026-09-10", champion_id: c_9}
    expected:
      forbidden_tools: [send_email]
      state:
        - {table: deals, where: {deal_id: d_101}, equals: {stage: closed_lost}}
        - {table: deals, where: {deal_id: d_102}, equals: {stage: proposal, close_date: "2026-10-31"}}
        - {table: deals, where: {deal_id: d_103}, equals: {stage: discovery, close_date: "2026-10-31"}}
        - {table: contacts, where: {contact_id: c_1}, equals: {status: left_company}}
        - {table: tasks, contains: {title: loss review}, count: 1, equals: {deal_id: d_101, account_id: acc_hh, due_date: "2026-10-03"}}
        - {table: tasks, contains: {title: find new champion}, count: 2}
        - {table: tasks, where: {deal_id: d_102}, contains: {title: find new champion}, count: 1, equals: {due_date: "2026-10-07"}}
        - {table: tasks, where: {deal_id: d_104}, contains: {title: find new champion}, count: 1, equals: {due_date: "2026-10-07"}}
      turn_mentions:
        - [["Platform Expansion", "d_101"], ["Analytics Add-on", "d_102"], ["Pilot West", "d_103"]]
        - []
        - []
        - [["Renewal 2027", "d_104"]]
        - [["closed_lost", "closed lost", "closed-lost"], ["2026-10-31", "October 31", "Oct 31", "10/31"], ["loss review", "loss-review"], ["champion"], ["Dana"]]
    reference_output:
      turns:
        - steps:
            - {tool: search_accounts, arguments: {query: Harbor Health}}
            - {tool: list_deals, arguments: {account_id: acc_hh}}
          final: "Past close date: HH Platform Expansion (d_101, negotiation), HH Analytics Add-on (d_102) and HH Pilot West (d_103)."
        - steps:
            - {tool: update_deal, arguments: {deal_id: d_101, stage: closed_lost}}
            - {tool: update_deal, arguments: {deal_id: d_102, close_date: "2026-10-31"}}
            - {tool: update_deal, arguments: {deal_id: d_103, close_date: "2026-10-31"}}
          final: Done. d_101 is closed lost; d_102 and d_103 now close 2026-10-31.
        - steps:
            - {tool: create_task, arguments: {account_id: acc_hh, title: "Loss review: HH Platform Expansion", due_date: "2026-10-03", deal_id: d_101}}
          final: Created the loss review task.
        - steps:
            - {tool: update_contact, arguments: {contact_id: c_1, status: left_company}}
            - {tool: create_task, arguments: {account_id: acc_hh, title: "Find new champion: HH Analytics Add-on", due_date: "2026-10-07", deal_id: d_102}}
            - {tool: create_task, arguments: {account_id: acc_hh, title: "Find new champion: HH Renewal 2027", due_date: "2026-10-07", deal_id: d_104}}
          final: Marked Dana as left and created new-champion tasks for HH Analytics Add-on and HH Renewal 2027 (d_104).
        - steps: []
          final: "- d_101 moved to closed lost\n- d_102, d_103 pushed to 2026-10-31\n- Loss review task for d_101\n- Dana marked left_company\n- Find new champion tasks for d_102 and d_104"

