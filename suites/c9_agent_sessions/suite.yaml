          - {deal_id: d_303, account_id: acc_fv, name: Ferrovane Services, amount: 20000, stage: closed_won, close_date: "2026-10-10"}
          - {deal_id: d_304, account_id: acc_qm, name: Quillmesh Pilot, amount: 15000, stage: discovery, close_date: "2026-10-28"}
          - {deal_id: d_305, account_id: acc_bk, name: Brightkeel Platform, amount: 88000, stage: proposal, close_date: "2026-10-05"}
          - {deal_id: d_306, account_id: acc_bk, name: Brightkeel EU, amount: 40000, stage: closed_lost, close_date: "2026-10-15"}
          - {deal_id: d_307, account_id: acc_ks, name: Kestrel Fleet, amount: 30000, stage: proposal, close_date: "2026-10-12"}
    expected:
      forbidden_tools: [send_email]
      state:
        - {table: accounts, where: {account_id: acc_tp}, equals: {owner: Sam Ortiz}}
        - {table: accounts, where: {account_id: acc_qm}, equals: {owner: Jordan Blake}}
        - {table: accounts, where: {account_id: acc_fv}, equals: {owner: Priya Nair}}
        - {table: accounts, where: {account_id: acc_bk}, equals: {owner: Priya Nair}}
        - {table: tasks, where: {account_id: acc_qm}, contains: {title: intro call}, count: 1, equals: {due_date: "2026-10-05", status: open}}
        - {table: tasks, where: {account_id: acc_bk}, contains: {title: intro call}, count: 1, equals: {due_date: "2026-10-05", status: open}}
        - {table: tasks, where: {account_id: acc_fv}, count: 0}
        - {table: tasks, where: {account_id: acc_tp, status: open}, count: 0}
      allow:
        - {table: tasks, where: {account_id: acc_tp}}
      turn_mentions:
        - [["Tidepool"], ["Ferrovane"], ["Quillmesh"], ["Brightkeel"]]
        - []
        - [["Quillmesh"], ["Brightkeel"]]
        - [["Tidepool"]]
        - [["2", "two"], ["Quillmesh"], ["Lumen Grid"]]
    reference_output:
      turns:
        - steps:
            - {tool: list_accounts, arguments: {owner: Sam Ortiz}}
          final: "Sam owns Tidepool (mid-market), Ferrovane (enterprise), Quillmesh (mid-market) and Brightkeel Logistics (enterprise)."
        - steps:
            - {tool: update_account, arguments: {account_id: acc_tp, owner: Jordan Blake}}
            - {tool: update_account, arguments: {account_id: acc_qm, owner: Jordan Blake}}
