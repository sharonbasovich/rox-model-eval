name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy rox_model_eval
      - run: pytest -q
      - name: Offline end-to-end eval (all suites, simulated judge)
        run: |
          python -m rox_model_eval run --models mock-strong,mock-cheap --suite all --reps 2 \
            --judge mock-strong --out runs --history runs/history.sqlite
          python -m rox_model_eval calibrate --judge mock-strong
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: runs/
